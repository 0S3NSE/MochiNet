<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-label="Mochi eyes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- OLED screen -->
  <rect x="0" y="0" width="440" height="220" rx="26" fill="#141019"/>
  <rect x="10" y="10" width="420" height="200" rx="20" fill="#0d0a12" stroke="#2a2335" stroke-width="2"/>

  <!-- eyes group: slow left/right "scanning" sweep -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 14 0; 14 0; 0 0; -14 0; -14 0; 0 0"
      keyTimes="0; 0.15; 0.35; 0.5; 0.65; 0.85; 1"
      dur="7s" repeatCount="indefinite"/>

    <!-- soft pink glow behind each eye -->
    <rect x="128" y="66" width="68" height="92" rx="22" fill="#ff9db1" opacity="0.18"/>
    <rect x="244" y="66" width="68" height="92" rx="22" fill="#ff9db1" opacity="0.18"/>

    <!-- LEFT eye (solid, no pupil) + blink -->
    <rect x="132" y="70" width="60" height="84" rx="18" fill="#f6eff6">
      <animate attributeName="height"
        values="84;84;84;8;84;84"
        keyTimes="0;0.90;0.93;0.955;0.985;1" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="y"
        values="70;70;70;108;70;70"
        keyTimes="0;0.90;0.93;0.955;0.985;1" dur="4.2s" repeatCount="indefinite"/>
    </rect>

    <!-- RIGHT eye (solid, no pupil) + blink -->
    <rect x="248" y="70" width="60" height="84" rx="18" fill="#f6eff6">
      <animate attributeName="height"
        values="84;84;84;8;84;84"
        keyTimes="0;0.90;0.93;0.955;0.985;1" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="y"
        values="70;70;70;108;70;70"
        keyTimes="0;0.90;0.93;0.955;0.985;1" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- tiny pink power LED, slow pulse -->
  <circle cx="404" cy="26" r="4" fill="#ff9db1">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
