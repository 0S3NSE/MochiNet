<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="ui-monospace,Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="760" height="520" rx="16" fill="#17171b"/>
  <text x="32" y="40" fill="#f5ede6" font-size="22" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">🐷 MochiNet · ESP32-S3 Pinout</text>
  <text x="32" y="60" fill="#9aa0a6" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">LOLIN S3 Mini / ESP32-S3 Super Mini · GPIO numbers</text>

  <!-- ============ LEFT COLUMN ============ -->

  <!-- DISPLAY (I2C) -->
  <g>
    <rect x="28" y="80" width="340" height="114" rx="8" fill="#1f1f25" stroke="#2c2c33"/>
    <rect x="28" y="80" width="6" height="74" rx="3" fill="#35c2b0"/>
    <text x="46" y="100" fill="#35c2b0" font-size="13" font-weight="700">OLED DISPLAY · I²C </text>
    <text x="46" y="122" fill="#d7cfc8" font-size="13">GND</text><text x="352" y="122" fill="#35c2b0" font-size="13" text-anchor="end">3.3v Buck -</text>
    <text x="46" y="142" fill="#d7cfc8" font-size="13">VCC</text><text x="352" y="142" fill="#35c2b0" font-size="13" text-anchor="end">3.3v Buck +</text>
    <text x="46" y="122" fill="#d7cfc8" font-size="13">SDA</text><text x="352" y="122" fill="#35c2b0" font-size="13" text-anchor="end">GPIO8</text>
    <text x="46" y="142" fill="#d7cfc8" font-size="13">SCL</text><text x="352" y="142" fill="#35c2b0" font-size="13" text-anchor="end">GPIO9</text>
  </g>

  <!-- SD CARD (SPI) -->
  <g>
    <rect x="28" y="166" width="340" height="114" rx="8" fill="#1f1f25" stroke="#2c2c33"/>
    <rect x="28" y="166" width="6" height="114" rx="3" fill="#5a9bf0"/>
    <text x="46" y="186" fill="#5a9bf0" font-size="13" font-weight="700">SD CARD · SPI (FSPI)</text>
    <text x="46" y="208" fill="#d7cfc8" font-size="13">VCC</text>  <text x="352" y="208" fill="#5a9bf0" font-size="13" text-anchor="end">5V Step Up OUT</text>
    <text x="46" y="228" fill="#d7cfc8" font-size="13">GND</text><text x="352" y="228" fill="#5a9bf0" font-size="13" text-anchor="end">5V Step Up GND</text>
    <text x="46" y="208" fill="#d7cfc8" font-size="13">CS</text>  <text x="352" y="208" fill="#5a9bf0" font-size="13" text-anchor="end">GPIO10</text>
    <text x="46" y="228" fill="#d7cfc8" font-size="13">MOSI</text><text x="352" y="228" fill="#5a9bf0" font-size="13" text-anchor="end">GPIO11</text>
    <text x="46" y="248" fill="#d7cfc8" font-size="13">SCK</text> <text x="352" y="248" fill="#5a9bf0" font-size="13" text-anchor="end">GPIO12</text>
    <text x="46" y="268" fill="#d7cfc8" font-size="13">MISO</text><text x="352" y="268" fill="#5a9bf0" font-size="13" text-anchor="end">GPIO13</text>
  </g>

  <!-- GPS (UART1) -->
  <g>
    <rect x="28" y="292" width="340" height="74" rx="8" fill="#1f1f25" stroke="#2c2c33"/>
    <rect x="28" y="292" width="6" height="74" rx="3" fill="#5fd17a"/>
    <text x="46" y="312" fill="#5fd17a" font-size="13" font-weight="700">GPS · UART1 @ 9600</text>
    <text x="46" y="334" fill="#d7cfc8" font-size="13">RX  (← GPS TX)</text><text x="352" y="334" fill="#5fd17a" font-size="13" text-anchor="end">GPIO16</text>
    <text x="46" y="208" fill="#d7cfc8" font-size="13">VCC</text>  <text x="352" y="208" fill="#5a9bf0" font-size="13" text-anchor="end">5V Step Up OUT</text>
    <text x="46" y="228" fill="#d7cfc8" font-size="13">GND</text><text x="352" y="228" fill="#5a9bf0" font-size="13" text-anchor="end">5V Step Up GND</text>
  </g>

  <!-- BUTTONS -->
  <g>
    <rect x="28" y="378" width="340" height="114" rx="8" fill="#1f1f25" stroke="#2c2c33"/>
    <rect x="28" y="378" width="6" height="114" rx="3" fill="#9aa0a6"/>
    <text x="46" y="398" fill="#c3c7cc" font-size="13" font-weight="700">BUTTONS · INPUT_PULLUP (active-LOW)(ALL TO S3 GND)</text>
    <text x="46" y="420" fill="#d7cfc8" font-size="13">UP</text>    <text x="352" y="420" fill="#c3c7cc" font-size="13" text-anchor="end">GPIO1</text>
    <text x="46" y="440" fill="#d7cfc8" font-size="13">DOWN</text>  <text x="352" y="440" fill="#c3c7cc" font-size="13" text-anchor="end">GPIO2</text>
    <text x="46" y="460" fill="#d7cfc8" font-size="13">SELECT</text><text x="352" y="460" fill="#c3c7cc" font-size="13" text-anchor="end">GPIO14</text>
    <text x="46" y="480" fill="#d7cfc8" font-size="13">BACK</text>  <text x="352" y="480" fill="#c3c7cc" font-size="13" text-anchor="end">GPIO7</text>
  </g>

  <!-- ============ RIGHT COLUMN ============ -->

  <!-- BadUSB (UART2) -->
  <g>
    <rect x="392" y="80" width="340" height="74" rx="8" fill="#1f1f25" stroke="#2c2c33"/>
    <rect x="392" y="80" width="6" height="74" rx="3" fill="#f0983a"/>
    <text x="410" y="100" fill="#f0983a" font-size="13" font-weight="700">BadUSB · UART2 @ 9600</text>
    <text x="410" y="122" fill="#d7cfc8" font-size="13">P2</text><text x="716" y="122" fill="#f0983a" font-size="13" text-anchor="end">GPIO18</text>
  </g>

  <!-- CC1101 Sub-GHz -->
  <g>
    <rect x="392" y="166" width="340" height="114" rx="8" fill="#1f1f25" stroke="#2c2c33"/>
    <rect x="392" y="166" width="6" height="114" rx="3" fill="#b07cf0"/>
    <text x="410" y="186" fill="#b07cf0" font-size="13" font-weight="700">CC1101 Sub-GHz · optional</text>
    <text x="410" y="208" fill="#d7cfc8" font-size="13">SCK / MOSI / MISO</text><text x="716" y="208" fill="#5a9bf0" font-size="12" text-anchor="end">shared SD 12/11/13</text>
    <text x="410" y="228" fill="#d7cfc8" font-size="13">CSN</text> <text x="716" y="228" fill="#b07cf0" font-size="13" text-anchor="end">GPIO3</text>
    <text x="410" y="248" fill="#d7cfc8" font-size="13">GDO0</text><text x="716" y="248" fill="#b07cf0" font-size="13" text-anchor="end">GPIO38</text>
    <text x="410" y="268" fill="#d7cfc8" font-size="13">GDO2</text><text x="716" y="268" fill="#b07cf0" font-size="13" text-anchor="end">GPIO33</text>
    <text x="46" y="122" fill="#d7cfc8" font-size="13">GND</text><text x="352" y="122" fill="#35c2b0" font-size="13" text-anchor="end">3.3v Buck -</text>
    <text x="46" y="142" fill="#d7cfc8" font-size="13">VCC</text><text x="352" y="142" fill="#35c2b0" font-size="13" text-anchor="end">3.3v Buck +</text>
  </g>

  <!-- I2S MIC -->
  <g>
    <rect x="392" y="292" width="340" height="94" rx="8" fill="#1f1f25" stroke="#2c2c33"/>
    <rect x="392" y="292" width="6" height="94" rx="3" fill="#f07cb0"/>
    <text x="410" y="312" fill="#f07cb0" font-size="13" font-weight="700">I²S MIC · MS3625 · optional</text>
    <text x="46" y="122" fill="#d7cfc8" font-size="13">GND</text><text x="352" y="122" fill="#35c2b0" font-size="13" text-anchor="end">3.3v Buck -</text>
    <text x="46" y="142" fill="#d7cfc8" font-size="13">VCC</text><text x="352" y="142" fill="#35c2b0" font-size="13" text-anchor="end">3.3v Buck +</text>
    <text x="410" y="334" fill="#d7cfc8" font-size="13">BCLK</text>     <text x="716" y="334" fill="#f07cb0" font-size="13" text-anchor="end">GPIO4</text>
    <text x="410" y="354" fill="#d7cfc8" font-size="13">WS / LRCK</text><text x="716" y="354" fill="#f07cb0" font-size="13" text-anchor="end">GPIO5</text>
    <text x="410" y="374" fill="#d7cfc8" font-size="13">DIN</text>      <text x="716" y="374" fill="#f07cb0" font-size="13" text-anchor="end">GPIO6</text>
  </g>

  <!-- LED -->
  <g>
    <rect x="392" y="398" width="340" height="54" rx="8" fill="#1f1f25" stroke="#2c2c33"/>
    <rect x="392" y="398" width="6" height="54" rx="3" fill="#f0d24a"/>
    <text x="410" y="418" fill="#f0d24a" font-size="13" font-weight="700">STATUS LED · active-LOW</text>
    <text x="410" y="440" fill="#d7cfc8" font-size="13">onboard</text><text x="716" y="440" fill="#f0d24a" font-size="13" text-anchor="end">GPIO21</text>
  </g>

  <text x="392" y="478" fill="#8a8a90" font-size="11">GPIO21 LED &amp; GPIO3 CSN vary by board — verify. Power modules from 3.3V only.</text>
  <text x="392" y="492" fill="#8a8a90" font-size="11">CC1101 shares the SD SPI bus — don't use both at once.</text>
</svg>
