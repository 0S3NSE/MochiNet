<svg xmlns="http://www.w3.org/2000/svg" width="760" height="670" viewBox="0 0 760 670" font-family="ui-monospace,Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="760" height="670" rx="16" fill="#17171b"/>
  <text x="32" y="40" fill="#f5ede6" font-size="22" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">🐷 MochiNet · ESP32-S3 Pinout</text>
  <text x="32" y="60" fill="#9aa0a6" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">LOLIN S3 Mini / ESP32-S3 Super Mini · GPIO numbers</text>

  <!-- ============ LEFT COLUMN ============ -->

  <!-- OLED DISPLAY (I2C) -->
  <g>
    <rect x="28" y="84" width="340" height="116" rx="8" fill="#1f1f25" stroke="#2c2c33"/>
    <rect x="28" y="84" width="6" height="116" rx="3" fill="#35c2b0"/>
    <text x="46" y="104" fill="#35c2b0" font-size="13" font-weight="700">OLED DISPLAY · I²C</text>
    <text x="46" y="126" fill="#d7cfc8" font-size="13">VCC</text><text x="352" y="126" fill="#35c2b0" font-size="13" text-anchor="end">3.3V Buck +</text>
    <text x="46" y="146" fill="#d7cfc8" font-size="13">GND</text><text x="352" y="146" fill="#35c2b0" font-size="13" text-anchor="end">3.3V Buck -</text>
    <text x="46" y="166" fill="#d7cfc8" font-size="13">SDA</text><text x="352" y="166" fill="#35c2b0" font-size="13" text-anchor="end">GPIO8</text>
    <text x="46" y="186" fill="#d7cfc8" font-size="13">SCL</text><text x="352" y="186" fill="#35c2b0" font-size="13" text-anchor="end">GPIO9</text>
  </g>

  <!-- SD CARD (SPI) -->
  <g>
    <rect x="28" y="212" width="340" height="156" rx="8" fill="#1f1f25" stroke="#2c2c33"/>
    <rect x="28" y="212" width="6" height="156" rx="3" fill="#5a9bf0"/>
    <text x="46" y="232" fill="#5a9bf0" font-size="13" font-weight="700">SD CARD · SPI (FSPI)</text>
    <text x="46" y="254" fill="#d7cfc8" font-size="13">VCC</text> <text x="352" y="254" fill="#5a9bf0" font-size="13" text-anchor="end">5V Step Up OUT</text>
    <text x="46" y="274" fill="#d7cfc8" font-size="13">GND</text> <text x="352" y="274" fill="#5a9bf0" font-size="13" text-anchor="end">5V Step Up GND</text>
    <text x="46" y="294" fill="#d7cfc8" font-size="13">CS</text>  <text x="352" y="294" fill="#5a9bf0" font-size="13" text-anchor="end">GPIO10</text>
    <text x="46" y="314" fill="#d7cfc8" font-size="13">MOSI</text><text x="352" y="314" fill="#5a9bf0" font-size="13" text-anchor="end">GPIO11</text>
    <text x="46" y="334" fill="#d7cfc8" font-size="13">SCK</text> <text x="352" y="334" fill="#5a9bf0" font-size="13" text-anchor="end">GPIO12</text>
    <text x="46" y="354" fill="#d7cfc8" font-size="13">MISO</text><text x="352" y="354" fill="#5a9bf0" font-size="13" text-anchor="end">GPIO13</text>
  </g>

  <!-- GPS (UART1) -->
  <g>
    <rect x="28" y="380" width="340" height="96" rx="8" fill="#1f1f25" stroke="#2c2c33"/>
    <rect x="28" y="380" width="6" height="96" rx="3" fill="#5fd17a"/>
    <text x="46" y="400" fill="#5fd17a" font-size="13" font-weight="700">GPS · UART1 @ 9600</text>
    <text x="46" y="422" fill="#d7cfc8" font-size="13">VCC</text> <text x="352" y="422" fill="#5fd17a" font-size="13" text-anchor="end">3.3V Buck +</text>
    <text x="46" y="442" fill="#d7cfc8" font-size="13">GND</text> <text x="352" y="442" fill="#5fd17a" font-size="13" text-anchor="end">3.3V Buck -</text>
    <text x="46" y="462" fill="#d7cfc8" font-size="13">RX (← GPS TX)</text><text x="352" y="462" fill="#5fd17a" font-size="13" text-anchor="end">GPIO16</text>
  </g>

  <!-- BUTTONS -->
  <g>
    <rect x="28" y="488" width="340" height="132" rx="8" fill="#1f1f25" stroke="#2c2c33"/>
    <rect x="28" y="488" width="6" height="132" rx="3" fill="#9aa0a6"/>
    <text x="46" y="508" fill="#c3c7cc" font-size="13" font-weight="700">BUTTONS · INPUT_PULLUP (active-LOW)</text>
    <text x="46" y="522" fill="#8a8a90" font-size="10">other leg of each button → GND</text>
    <text x="46" y="544" fill="#d7cfc8" font-size="13">UP</text>    <text x="352" y="544" fill="#c3c7cc" font-size="13" text-anchor="end">GPIO1</text>
    <text x="46" y="564" fill="#d7cfc8" font-size="13">DOWN</text>  <text x="352" y="564" fill="#c3c7cc" font-size="13" text-anchor="end">GPIO2</text>
    <text x="46" y="584" fill="#d7cfc8" font-size="13">SELECT</text><text x="352" y="584" fill="#c3c7cc" font-size="13" text-anchor="end">GPIO14</text>
    <text x="46" y="604" fill="#d7cfc8" font-size="13">BACK</text>  <text x="352" y="604" fill="#c3c7cc" font-size="13" text-anchor="end">GPIO7</text>
  </g>

  <!-- ============ RIGHT COLUMN ============ -->

  <!-- BadUSB (UART2) -->
  <g>
    <rect x="392" y="84" width="340" height="76" rx="8" fill="#1f1f25" stroke="#2c2c33"/>
    <rect x="392" y="84" width="6" height="76" rx="3" fill="#f0983a"/>
    <text x="410" y="104" fill="#f0983a" font-size="13" font-weight="700">BadUSB · UART2 @ 9600</text>
    <text x="410" y="126" fill="#d7cfc8" font-size="13">GND</text><text x="716" y="126" fill="#f0983a" font-size="13" text-anchor="end">ESP32 S3 GND</text>
    <text x="410" y="146" fill="#d7cfc8" font-size="13">P2</text> <text x="716" y="146" fill="#f0983a" font-size="13" text-anchor="end">GPIO18</text>
  </g>

  <!-- CC1101 Sub-GHz -->
  <g>
    <rect x="392" y="172" width="340" height="156" rx="8" fill="#1f1f25" stroke="#2c2c33"/>
    <rect x="392" y="172" width="6" height="156" rx="3" fill="#b07cf0"/>
    <text x="410" y="192" fill="#b07cf0" font-size="13" font-weight="700">CC1101 Sub-GHz · optional</text>
    <text x="410" y="214" fill="#d7cfc8" font-size="13">VCC</text><text x="716" y="214" fill="#b07cf0" font-size="13" text-anchor="end">3.3V Buck +</text>
    <text x="410" y="234" fill="#d7cfc8" font-size="13">GND</text><text x="716" y="234" fill="#b07cf0" font-size="13" text-anchor="end">3.3V Buck -</text>
    <text x="410" y="254" fill="#d7cfc8" font-size="13">SCK / MOSI / MISO</text><text x="716" y="254" fill="#5a9bf0" font-size="12" text-anchor="end">shared SD 12/11/13</text>
    <text x="410" y="274" fill="#d7cfc8" font-size="13">CSN</text> <text x="716" y="274" fill="#b07cf0" font-size="13" text-anchor="end">GPIO3</text>
    <text x="410" y="294" fill="#d7cfc8" font-size="13">GDO0</text><text x="716" y="294" fill="#b07cf0" font-size="13" text-anchor="end">GPIO38</text>
    <text x="410" y="314" fill="#d7cfc8" font-size="13">GDO2</text><text x="716" y="314" fill="#b07cf0" font-size="13" text-anchor="end">GPIO33</text>
  </g>

  <!-- I2S MIC -->
  <g>
    <rect x="392" y="340" width="340" height="136" rx="8" fill="#1f1f25" stroke="#2c2c33"/>
    <rect x="392" y="340" width="6" height="136" rx="3" fill="#f07cb0"/>
    <text x="410" y="360" fill="#f07cb0" font-size="13" font-weight="700">I²S MIC · MS3625 · optional</text>
    <text x="410" y="382" fill="#d7cfc8" font-size="13">VCC</text><text x="716" y="382" fill="#f07cb0" font-size="13" text-anchor="end">3.3V Buck +</text>
    <text x="410" y="402" fill="#d7cfc8" font-size="13">GND</text><text x="716" y="402" fill="#f07cb0" font-size="13" text-anchor="end">3.3V Buck -</text>
    <text x="410" y="422" fill="#d7cfc8" font-size="13">BCLK</text>      <text x="716" y="422" fill="#f07cb0" font-size="13" text-anchor="end">GPIO4</text>
    <text x="410" y="442" fill="#d7cfc8" font-size="13">WS / LRCK</text><text x="716" y="442" fill="#f07cb0" font-size="13" text-anchor="end">GPIO5</text>
    <text x="410" y="462" fill="#d7cfc8" font-size="13">DIN</text>       <text x="716" y="462" fill="#f07cb0" font-size="13" text-anchor="end">GPIO6</text>
  </g>

  <!-- LED -->
  <g>
    <rect x="392" y="488" width="340" height="56" rx="8" fill="#1f1f25" stroke="#2c2c33"/>
    <rect x="392" y="488" width="6" height="56" rx="3" fill="#f0d24a"/>
    <text x="410" y="508" fill="#f0d24a" font-size="13" font-weight="700">STATUS LED · onboard, active-LOW</text>
    <text x="410" y="530" fill="#d7cfc8" font-size="13">anode/cathode</text><text x="716" y="530" fill="#f0d24a" font-size="13" text-anchor="end">GPIO21</text>
  </g>

  <text x="28" y="636" fill="#8a8a90" font-size="11">GPIO21 LED &amp; GPIO3 CSN vary by board — verify. CC1101 and the mic/display run 3.3V only — never feed them from the 5V step-up.</text>
  <text x="28" y="652" fill="#8a8a90" font-size="11">CC1101 shares the SD SPI bus (12/11/13) — don't use both peripherals at once. BadUSB draws power over its own USB connection.</text>
</svg>
